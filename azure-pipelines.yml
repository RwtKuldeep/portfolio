
trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.14'
  azureServiceConnection: 'sc-portfolio-azure'
  webAppName: 'myportfolio'

steps:
  # 1. Select Python
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(pythonVersion)'
    displayName: 'Set Python version'

  # 2. Install dependencies
  - script: |
      python -m venv .venv
      source .venv/bin/activate
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py check
    displayName: 'Install dependencies and check Django'

  # 3. Create deployment ZIP
  - task: ArchiveFiles@2
    displayName: 'Package Django application'
    inputs:
      rootFolderOrFile: '$(Build.SourcesDirectory)'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
      replaceExistingArchive: true

  # 4. Publish deployment package
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/app.zip'
      artifact: 'django-package'
    displayName: 'Publish artifact'

  # 5. Deploy to Azure App Service
  - task: AzureWebApp@1
    displayName: 'Deploy Django portfolio'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      appType: 'webAppLinux'
      appName: '$(webAppName)'
      package: '$(Pipeline.Workspace)/django-package/app.zip'
      runtimeStack: 'PYTHON|3.14'
      startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 portfolio.wsgi'

